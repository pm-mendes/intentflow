[tool.poetry]
name = "intentflow"
version = "0.1.0"
description = "Intent-Conditioned Argument Mediation for Retrieval-to-Action Security in Agentic RAG"
authors = ["Anonymous Authors <anonymous@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://anonymous.4open.science/r/intentflow-raise26"
repository = "https://anonymous.4open.science/r/intentflow-raise26"
keywords = ["agentic-RAG", "security", "prompt-injection", "information-flow"]
packages = [{include = "intentflow", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# LLM — Intent extraction via API
openai = "^1.40"
python-dotenv = "^1.0"

# Data models & validation
pydantic = "^2.8"
pydantic-settings = "^2.3"

# Configuration
pyyaml = "^6.0"

# Security mediation pipeline (Phase 0: previously ad hoc pip-installed for
# standalone benchmarks only — sql_hardening.py and provenance_index.py are
# now wired into PolicyEngine/ProvenanceTracker and require these at runtime).
sqlglot = "^30.0"
pyahocorasick = "^2.1"
python-dateutil = "^2.9"

# Multimedia perception pipeline (Phase 4: screenshot/scanned-document ->
# OCR -> retrieval -> planner -> tool call -> mediator decision). pytesseract
# is a thin wrapper — it shells out to the `tesseract` binary, which must be
# installed separately (`apt-get install tesseract-ocr` / `brew install
# tesseract`); Pillow renders the synthetic document/screenshot fixtures.
pytesseract = "^0.3"
pillow = "^10.2"

# Utilities
loguru = "^0.7"
numpy = "^1.26"
pandas = "^2.2"
tqdm = "^4.66"

[tool.poetry.group.dev.dependencies]
# Tests
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"

# Code quality
ruff = "^0.5"
mypy = "^1.10"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff : linter + formatter (remplace flake8, isort, black)
[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled separately

# MyPy : vérification de types statique
[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.11"

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"
